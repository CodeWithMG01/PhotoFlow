[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photoflow"
version = "0.1.0"
description = "A local-first desktop photo organizer"
requires-python = ">=3.10"
dependencies = [
    "Pillow",
    "pillow-heif",
    "customtkinter"
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]